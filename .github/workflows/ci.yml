name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  core-linux:
    name: PetaCore tests (Linux)
    runs-on: ubuntu-24.04
    container: swift:6.2
    steps:
      - uses: actions/checkout@v6
      - name: Swift version
        run: swift --version
      - name: Test PetaCore
        run: swift test --package-path Packages/PetaCore

  ios:
    name: Build and test (iOS Simulator)
    # Xcode 27.1 (iOS 27.1 SDK), the same as the TestFlight build: needed for the iPhone Duo fold API.
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - name: Select Xcode 27.1
        run: |
          XCODE=$(ls -d /Applications/Xcode_27.1*.app | grep -vi beta | head -1)
          [ -n "$XCODE" ] || { echo "::error::Xcode 27.1 is not on this runner"; ls /Applications | grep -i xcode; exit 1; }
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          sw_vers
      - name: Generate the Xcode project
        run: |
          brew install xcodegen > /dev/null
          xcodegen --version
          xcodegen generate
      - name: Pick a simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          runtimes = sorted((r for r in devices if "iOS" in r), reverse=True)
          for runtime in runtimes:
              for d in devices[runtime]:
                  if d["name"].startswith("iPhone") and "Pro" not in d["name"] and "Duo" not in d["name"] and d.get("isAvailable"):
                      print(d["udid"]); sys.exit(0)
          for runtime in runtimes:
              for d in devices[runtime]:
                  if d["name"].startswith("iPhone") and "Duo" not in d["name"]:
                      print(d["udid"]); sys.exit(0)
          ')
          [ -n "$UDID" ] || { echo "::error::No iPhone simulator on this runner"; exit 1; }
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices | grep "$UDID"
          # Also an iPad and the iPhone Duo, for the pictures of the whole app with their real bars.
          pick() {
            xcrun simctl list devices available -j | python3 -c '
          import json, sys
          want = sys.argv[1]
          devices = json.load(sys.stdin)["devices"]
          for runtime in sorted((r for r in devices if "iOS" in r), reverse=True):
              for d in devices[runtime]:
                  if d["name"].startswith(want) and d.get("isAvailable"):
                      print(d["udid"]); sys.exit(0)
          ' "$1"
          }
          echo "ipad=$(pick "iPad Pro 13" || true)" >> "$GITHUB_OUTPUT"
          echo "duo=$(pick "iPhone Duo" || true)" >> "$GITHUB_OUTPUT"
          # App Store sizes: a large iPhone with Dynamic Island (Pro Max) and a medium one (Pro).
          big() {
            xcrun simctl list devices available -j | python3 -c '
          import json, sys
          want = sys.argv[1]
          devices = json.load(sys.stdin)["devices"]
          for runtime in sorted((r for r in devices if "iOS" in r), reverse=True):
              for d in devices[runtime]:
                  n = d["name"]
                  if n.startswith("iPhone") and d.get("isAvailable") and (n.endswith(" Pro Max") if want == "max" else n.endswith(" Pro")):
                      print(d["udid"]); sys.exit(0)
          ' "$1"
          }
          echo "promax=$(big max || true)" >> "$GITHUB_OUTPUT"
          echo "pro=$(big pro || true)" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices available | grep -E "iPad Pro 13|iPhone Duo|Pro Max| Pro \(" || true
      - name: Build and test
        run: |
          set +e
          xcodebuild test \
            -project Petacal.xcodeproj \
            -scheme Petacal \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO > xcodebuild.log 2>&1
          status=$?
          grep -E "error:|warning: .*(isolat|Sendable|concurrency)|Test (Suite|Case|run)|✔|✘|\*\* " xcodebuild.log | sort -u | head -300
          exit $status
      # The same test bundle on other simulators (no rebuild). These never fail the job: they only add pictures.
      - name: Whole app on an iPad
        if: steps.sim.outputs.ipad != ''
        continue-on-error: true
        run: |
          xcodebuild test-without-building \
            -project Petacal.xcodeproj -scheme Petacal \
            -destination "id=${{ steps.sim.outputs.ipad }}" \
            -derivedDataPath build/DerivedData \
            "-only-testing:PetacalTests/ScreenshotTests/deviceRoot()" \
            "-only-testing:PetacalTests/ScreenshotTests/storeShots()" \
            CODE_SIGNING_ALLOWED=NO > xcodebuild-ipad.log 2>&1 || true
          grep -E "error:|Test (Suite|Case|run)|✔|✘|\*\* " xcodebuild-ipad.log | sort -u | head -40
      # The iPhone Duo simulator starts folded, so this is the outer display.
      - name: Whole app on iPhone Duo (outer display)
        if: steps.sim.outputs.duo != ''
        continue-on-error: true
        run: |
          xcodebuild test-without-building \
            -project Petacal.xcodeproj -scheme Petacal \
            -destination "id=${{ steps.sim.outputs.duo }}" \
            -derivedDataPath build/DerivedData \
            "-only-testing:PetacalTests/ScreenshotTests/deviceRoot()" \
            "-only-testing:PetacalTests/ScreenshotTests/storeShots()" \
            CODE_SIGNING_ALLOWED=NO > xcodebuild-duo.log 2>&1 || true
          grep -E "error:|Test (Suite|Case|run)|✔|✘|\*\* " xcodebuild-duo.log | sort -u | head -40
          ls -la /tmp/petacal-shots | head -60
      # App Store screenshot sizes (App Store Connect Help, screenshot specifications).
      - name: App Store screenshots on the large and medium iPhones
        if: steps.sim.outputs.promax != '' || steps.sim.outputs.pro != ''
        continue-on-error: true
        run: |
          for udid in "${{ steps.sim.outputs.promax }}" "${{ steps.sim.outputs.pro }}"; do
            [ -n "$udid" ] || continue
            xcrun simctl list devices | grep "$udid" || true
            xcodebuild test-without-building \
              -project Petacal.xcodeproj -scheme Petacal \
              -destination "id=$udid" \
              -derivedDataPath build/DerivedData \
              "-only-testing:PetacalTests/ScreenshotTests/storeShots()" \
              CODE_SIGNING_ALLOWED=NO > "xcodebuild-store-$udid.log" 2>&1 || true
            grep -E "error:|Test (Suite|Case|run)|✔|✘|\*\* " "xcodebuild-store-$udid.log" | sort -u | head -20
          done
          ls /tmp/petacal-shots | grep '^store-' || true
      - name: Upload the screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: screenshots
          path: /tmp/petacal-shots
          if-no-files-found: warn
          retention-days: 7
      - name: Upload the build log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: xcodebuild-log
          path: xcodebuild.log
          retention-days: 7

  mac:
    name: Build and test (Mac)
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - name: Select Xcode 27.1
        run: |
          XCODE=$(ls -d /Applications/Xcode_27.1*.app | grep -vi beta | head -1)
          [ -n "$XCODE" ] || { echo "::error::Xcode 27.1 is not on this runner"; ls /Applications | grep -i xcode; exit 1; }
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          sw_vers
      - name: Generate the Xcode project
        run: |
          brew install xcodegen > /dev/null
          xcodegen generate
      # Signed "to run locally" and without the sandbox, so the tests can save the pictures of the window.
      - name: Build and test
        run: |
          set +e
          xcodebuild test \
            -project Petacal.xcodeproj \
            -scheme PetacalMac \
            -destination "platform=macOS" \
            -derivedDataPath build/DerivedDataMac \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= PROVISIONING_PROFILE_SPECIFIER= \
            CODE_SIGN_ENTITLEMENTS= ENABLE_HARDENED_RUNTIME=NO > xcodebuild-mac.log 2>&1
          status=$?
          grep -E "error:|warning: .*(isolat|Sendable|concurrency)|Test (Suite|Case|run)|✔|✘|\*\* " xcodebuild-mac.log | sort -u | head -300
          ls -la /tmp/petacal-shots-mac 2>/dev/null
          exit $status
      - name: Upload the screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: screenshots-mac
          path: /tmp/petacal-shots-mac
          if-no-files-found: warn
          retention-days: 7
      - name: Upload the build log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: xcodebuild-mac-log
          path: xcodebuild-mac.log
          retention-days: 7
