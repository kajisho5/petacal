# Mac 版を TestFlight に送る（kajisho5/runway の共通ワークフロー、platform: macos）
name: testflight-mac

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    uses: kajisho5/runway/.github/workflows/apple-testflight.yml@main
    with:
      bundle_id: com.seventhwell.petacal
      project: Petacal.xcodeproj
      scheme: PetacalMac
      platform: macos
      pre_build: brew install xcodegen && xcodegen generate
      xcode: "27.1"
      runner: xcode-27
    secrets: inherit
