ext-anchor="start" data-bg="#2C2C2E">18日(水)15時からで</text><text x="138" y="234" font-family="-apple-system, 'SF Pro Text', 'Hiragino Sans', 'Noto Sans JP', 'Noto Sans CJK JP', sans-serif" font-size="17" font-weight="400" fill="#FFFFFF" text-anchor="start" data-bg="#2C2C2E">お願いします。場所は</text><text x="138" y="260" font-family="-apple-system, 'SF Pro Text', 'Hiragino Sans', 'Noto Sans JP', 'Noto Sans CJK JP', sans-serif" font-size="17" font-weight="400" fill="#FFFFFF" text-anchor="start" data-bg="#2C2C2E">会議室Bです。</text><rect x="24" y="306" width="354" height="160" rx="20" fill="#2C2C2E"/><rect x="40" y="324" width="44" height="44" rx="12" fill="#253C4F"/><g transform="translate(62,346) scale(0.9)" fill="none" stroke="#5CB8FF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="-10" y="-9" width="20" height="18" rx="3"/><path d="M-10 -3h20M-5 -12v5M5 -12v5"/></g><text x="100" y="342" font-family="-apple-system, 'SF Pro Text', 'Hiragino Sans', 'Noto Sans JP', 'Noto Sans CJK JP', sans-serif" font-size="17" font-weight="600" fill="#FFFFFF" text-anchor="start" data-bg="#2C2C2E">予定にする</text><text x="100" y="364" font-family="-apple-system, 'SF Pro Text', 'Hiragino Sans', 'Noto Sans JP', 'Noto Sans CJK JP', sans-serif" font-size="13" font-weight="400" fill="#EBEBF5" text-anchor="start" opacity="0.6" data-bg="#2C2C2E">日付と時刻を読み取ってカレンダーに追加</text><g transform="translate(358,346) scale(0.8)" fill="none" stroke="#EBEBF5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M-3 -6l6 6-6 6"/></g><rect x="100" y="385.5" width="262" height="0.5" rx="0" fill="#38383A"/><rect x="40" y="404" width="44" height="44" rx="12" fill="#253C4F"/><g transform="translate(62,426) scale(0.9)" fill="none" stroke="#5CB8FF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="-9" y="-10" width="18" height="20" rx="3"/><path d="M-5 -4h10M-5 0h10M-5 4h6"/></g><text x="100" y="422" font-family="-apple-system, 'SF Pro Text', 'Hiragino Sans', 'Noto Sans JP', 'Noto Sans CJK JP', sans-serif" font-size="17" font-weight="600" fill="#FFFFFF" text-anchor="start" data-bg="#2C2C2E">記録にする</text><text x="100" y="444" font-family="-apple-system, 'SF Pro Text', 'Hiragino Sans', 'Noto Sans JP', 'Noto Sans CJK JP', sans-serif" font-size="13" font-weight="400" fill="#EBEBF5" text-anchor="start" opacity="0.6" data-bg="#2C2C2E">写真とメモを今日の記録として保存</text><g transform="translate(358,426) scale(0.8)" fill="none" stroke="#EBEBF5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M-3 -6l6 6-6 6"/></g><text x="24" y="494" font-family="-apple-system, 'SF Pro Text', 'Hiragino Sans', 'Noto Sans JP', 'Noto Sans CJK JP', sans-serif" font-size="13" font-weight="400" fill="#EBEBF5" text-anchor="start" opacity="0.6" data-bg="#1C1C1E">「予定にする」はAI取り込みを1回使います。</text><text x="24" y="514" font-family="-apple-system, 'SF Pro Text', 'Hiragino Sans', 'Noto Sans JP', 'Noto Sans CJK JP', sans-serif" font-size="13" font-weight="400" fill="#EBEBF5" text-anchor="start" opacity="0.6" data-bg="#1C1C1E">今月の残り3回（無料版は月5回）。</text><text x="24" y="534" font-family="-apple-system, 'SF Pro Text', 'Hiragino Sans', 'Noto Sans JP', 'Noto Sans CJK JP', sans-serif" font-size="13" font-weight="400" fill="#EBEBF5" text-anchor="start" opacity="0.6" data-bg="#1C1C1E">「記録にする」は回数に数えません。</text><rect x="131" y="861" width="140" height="5" rx="2.5" fill="#FFFFFF"/></svg>
