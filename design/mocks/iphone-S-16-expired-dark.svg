83A" stroke-width="0.5"/><g transform="translate(46,424) scale(1.0)" fill="none" stroke="#5CB8FF" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><path d="M-8 0h16M0 -8v16"/></g><text x="70" y="430" font-family="-apple-system, 'SF Pro Text', 'Hiragino Sans', 'Noto Sans JP', 'Noto Sans CJK JP', sans-serif" font-size="17" font-weight="400" fill="#5CB8FF" text-anchor="start" data-bg="#1C1C1E">Google アカウントを追加</text><text x="32" y="472" font-family="-apple-system, 'SF Pro Text', 'Hiragino Sans', 'Noto Sans JP', 'Noto Sans CJK JP', sans-serif" font-size="13" font-weight="400" fill="#EBEBF5" text-anchor="start" opacity="0.6">しばらく使わなかったか、Google 側でアクセスを</text><text x="32" y="490" font-family="-apple-system, 'SF Pro Text', 'Hiragino Sans', 'Noto Sans JP', 'Noto Sans CJK JP', sans-serif" font-size="13" font-weight="400" fill="#EBEBF5" text-anchor="start" opacity="0.6">取り消したため、予定を読み込めません。押して</text><text x="32" y="508" font-family="-apple-system, 'SF Pro Text', 'Hiragino Sans', 'Noto Sans JP', 'Noto Sans CJK JP', sans-serif" font-size="13" font-weight="400" fill="#EBEBF5" text-anchor="start" opacity="0.6">ログインし直すと、元どおりに表示されます。</text><rect x="21" y="778" width="288" height="62" rx="31" fill="#2C2C2E" fill-opacity="0.82" stroke="#48484A"/><rect x="47" y="791" width="20" height="18" rx="3" fill="#FFFFFF"/><rect x="47" y="796" width="20" height="1.5" rx="0" fill="#2C2C2E"/><text x="57" y="828" font-family="-apple-system, 'SF Pro Text', 'Hiragino Sans', 'Noto Sans JP', 'Noto Sans CJK JP', sans-serif" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle" data-bg="#2C2C2E">カレンダー</text><rect x="120" y="790" width="18" height="20" rx="3" fill="#FFFFFF"/><rect x="124" y="795" width="10" height="1.5" rx="0" fill="#2C2C2E"/><rect x="124" y="799" width="10" height="1.5" rx="0" fill="#2C2C2E"/><rect x="124" y="803" width="6" height="1.5" rx="0" fill="#2C2C2E"/><text x="129" y="828" font-family="-apple-system, 'SF Pro Text', 'Hiragino Sans', 'Noto Sans JP', 'Noto Sans CJK JP', sans-serif" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle" data-bg="#2C2C2E">記録</text><rect x="191" y="801" width="5" height="9" rx="1.5" fill="#FFFFFF"/><rect x="198.5" y="794" width="5" height="16" rx="1.5" fill="#FFFFFF"/><rect x="206" y="790" width="5" height="20" rx="1.5" fill="#FFFFFF"/><text x="201" y="828" font-family="-apple-system, 'SF Pro Text', 'Hiragino Sans', 'Noto Sans JP', 'Noto Sans CJK JP', sans-serif" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle" data-bg="#2C2C2E">集計</text><rect x="239" y="783" width="68" height="52" rx="26" fill="#273847"/><circle cx="273.0" cy="800" r="9" fill="#5CB8FF"/><circle cx="273.0" cy="800" r="3.5" fill="#273847"/><text x="273" y="828" font-family="-apple-system, 'SF Pro Text', 'Hiragino Sans', 'Noto Sans JP', 'Noto Sans CJK JP', sans-serif" font-size="11" font-weight="600" fill="#5CB8FF" text-anchor="middle" data-bg="#273847">設定</text><circle cx="350.0" cy="809.0" r="31.0" fill="#2C2C2E" fill-opacity="0.82" stroke="#48484A"/><g transform="translate(350,809) scale(1.0)" fill="none" stroke="#FFFFFF" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><circle cx="-2" cy="-2" r="7"/><path d="M3 3l5 5"/></g><rect x="131" y="861" width="140" height="5" rx="2.5" fill="#FFFFFF"/></svg>
