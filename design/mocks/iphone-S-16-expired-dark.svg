<svg xmlns="http://www.w3.org/2000/svg" width="402" height="874" viewBox="0 0 402 874" data-bg="#000000"><rect width="100%" height="100%" fill="#000000"/><text x="54" y="37" font-family="-apple-system, 'SF Pro Text', 'Hiragino Sans', 'Noto Sans JP', 'Noto Sans CJK JP', sans-serif" font-size="17" font-weight="600" fill="#FFFFFF" text-anchor="middle">9:41</text><rect x="340" y="25" width="26" height="13" rx="4" fill="none" stroke="#FFFFFF" stroke-opacity="0.4"/><rect x="342" y="27" width="20" height="9" rx="2" fill="#FFFFFF"/><g aria-label="設定に戻る"><circle cx="38" cy="84" r="22" fill="#2C2C2E" fill-opacity="0.82" stroke="#48484A"/><g transform="translate(38,84) scale(1.0)" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 -10l-10 10 10 10"/></g></g><text x="20" y="148" font-family="-apple-system, 'SF Pro Text', 'Hiragino Sans', 'Noto Sans JP', 'Noto Sans CJK JP', sans-serif" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="start">カレンダーのアカウント</text><text x="20" y="174" font-family="-apple-system, 'SF Pro Text', 'Hiragino Sans', 'Noto Sans JP', 'Noto Sans CJK JP', sans-serif" font-size="15" font-weight="400" fill="#EBEBF5" text-anchor="start" opacity="0.6">予定を読み込むカレンダーを選びます。</text><text x="32" y="212" font-family="-apple-system, 'SF Pro Text', 'Hiragino Sans', 'Noto Sans JP', 'Noto Sans CJK JP', sans-serif" font-size="13" font-weight="400" fill="#EBEBF5" text-anchor="start" opacity="0.6">この iPhone</text><rect x="16" y="222" width="370" height="52" rx="24" fill="#1C1C1E"/><g transform="translate(46,248) scale(1.0)" fill="none" stroke="#0091FF" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><rect x="-10" y="-9" width="20" height="18" rx="3"/><path d="M-10 -3h20M-5 -12v5M5 -12v5"/></g><text x="70" y="254" font-family="-apple-system, 'SF Pro Text', 'Hiragino Sans', 'Noto Sans JP', 'Noto Sans CJK JP', sans-serif" font-size="17" font-weight="400" fill="#FFFFFF" text-anchor="start" data-bg="