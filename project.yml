name: Petacal
options:
  bundleIdPrefix: com.seventhwell
  developmentLanguage: ja
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.11.0"
    CURRENT_PROJECT_VERSION: "1"
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
packages:
  PetaCore:
    path: Packages/PetaCore
targets:
  Petacal:
    type: application
    platform: iOS
    sources:
      - path: Petacal
      - path: Shared
    dependencies:
      - package: PetaCore
      - target: PetacalShare
    info:
      path: Petacal/Info.plist
      properties:
        CFBundleDisplayName: ペタカレ
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: ja
        ITSAppUsesNonExemptEncryption: false
        NSCalendarsFullAccessUsageDescription: 端末のカレンダーの予定を表示・追加するために使います。
        NSFaceIDUsageDescription: 記録のロックを解除するために Face ID を使います。
        NSPhotoLibraryAddUsageDescription: まとめ画像を写真に保存するために使います。
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UIBackgroundModes: [remote-notification]
        PetacalTeamPrefix: $(AppIdentifierPrefix)
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations~iphone:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    entitlements:
      path: PetacalSupport/Petacal.entitlements
      properties:
        # 「ペタカレに送る」との受け渡し（キーチェーンの共有。Apple のサイトでの登録は要らない）
        keychain-access-groups: [$(AppIdentifierPrefix)com.seventhwell.petacal.shared]
        # 記録を iCloud（CloudKit の個人用の領域）で、設定をキーと値の iCloud でそろえる（cloudkit/README.md）
        com.apple.developer.icloud-container-identifiers: [iCloud.com.seventhwell.petacal]
        com.apple.developer.icloud-services: [CloudKit]
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)$(CFBundleIdentifier)
        aps-environment: development
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.seventhwell.petacal
        PRODUCT_NAME: Petacal
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
  # 「ペタカレに送る」: the share menu of other apps. Hands what it gets to the app through the app group.
  PetacalShare:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareExtension
      - path: Shared
    info:
      path: PetacalSupport/Share-Info.plist
      properties:
        CFBundleDisplayName: ペタカレに送る
        PetacalTeamPrefix: $(AppIdentifierPrefix)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: ja
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsImageWithMaxCount: 10
    entitlements:
      path: PetacalSupport/PetacalShare.entitlements
      properties:
        keychain-access-groups: [$(AppIdentifierPrefix)com.seventhwell.petacal.shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.seventhwell.petacal.share
        PRODUCT_NAME: PetacalShare
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
  # The Mac app: the same sources, built natively (not Catalyst). Not sent to TestFlight yet (runway has no macOS).
  PetacalMac:
    type: application
    platform: macOS
    sources:
      - path: Petacal
        excludes:
          - Info.plist
      - path: Shared
    dependencies:
      - package: PetaCore
    info:
      path: PetacalMac/Info.plist
      properties:
        CFBundleDisplayName: ペタカレ
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: ja
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.productivity
        NSCalendarsFullAccessUsageDescription: 登録してあるカレンダーの予定を表示・追加するために使います。
    entitlements:
      path: PetacalMac/Petacal.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.personal-information.calendars: true
        com.apple.security.files.user-selected.read-only: true
        com.apple.security.network.client: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.seventhwell.petacal
        PRODUCT_NAME: Petacal
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
  PetacalMacTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: PetacalMacTests
    dependencies:
      - target: PetacalMac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.seventhwell.petacalMacTests
        GENERATE_INFOPLIST_FILE: YES
        # The Mac app's product is named Petacal (same module name as on iPhone), not PetacalMac.
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Petacal.app/Contents/MacOS/Petacal
        BUNDLE_LOADER: $(TEST_HOST)
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
  PetacalTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PetacalTests
    dependencies:
      - target: Petacal
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.seventhwell.petacalTests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
schemes:
  Petacal:
    build:
      targets:
        Petacal: all
        PetacalTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - PetacalTests
        - package: PetaCore/PetaCoreTests
  PetacalMac:
    build:
      targets:
        PetacalMac: all
        PetacalMacTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - PetacalMacTests
