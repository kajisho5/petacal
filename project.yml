name: Petacal
options:
  bundleIdPrefix: com.seventhwell
  developmentLanguage: ja
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.4.1"
    CURRENT_PROJECT_VERSION: "1"
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
packages:
  PetaCore:
    path: Packages/PetaCore
targets:
  Petacal:
    type: application
    platform: iOS
    sources:
      - path: Petacal
    dependencies:
      - package: PetaCore
    info:
      path: Petacal/Info.plist
      properties:
        CFBundleDisplayName: ペタカレ
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: ja
        ITSAppUsesNonExemptEncryption: false
        NSCalendarsFullAccessUsageDescription: 端末のカレンダーの予定を表示・追加するために使います。
        NSFaceIDUsageDescription: 記録のロックを解除するために Face ID を使います。
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations~iphone:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.seventhwell.petacal
        PRODUCT_NAME: Petacal
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
  PetacalTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PetacalTests
    dependencies:
      - target: Petacal
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.seventhwell.petacalTests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
schemes:
  Petacal:
    build:
      targets:
        Petacal: all
        PetacalTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - PetacalTests
        - package: PetaCore/PetaCoreTests
